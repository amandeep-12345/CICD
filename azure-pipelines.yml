trigger:
- main   # jab bhi main branch pe push hoga

pool:
  vmImage: 'ubuntu-latest'

variables:
  nodeVersion: '18.x'

stages:
# ------------------ BUILD STAGE ------------------
- stage: Build
  displayName: Build Stage
  jobs:
  - job: BuildJob
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
      displayName: 'Install Node.js'

    - script: |
        npm install
        npm run build
      displayName: 'Install & Build'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: 'dist'
        ArtifactName: 'drop'
      displayName: 'Publish Artifacts'

# ------------------ DEPLOY STAGE ------------------
- stage: Deploy
  displayName: Deploy Stage
  dependsOn: Build
  jobs:
  - deployment: DeployWeb
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop

          - script: |
              echo "Deploying application..."
              # yahan actual deploy command likh
              # example: Azure Web App deploy / Docker push
            displayName: 'Deploy Step'